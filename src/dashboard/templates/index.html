<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voiseege - Shabbat Audio Intelligence Dashboard</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-mosque me-2"></i>Voiseege Dashboard
                </a>
                <div class="d-flex">
                    <div class="text-light me-3" id="shabbat-status">
                        <i class="fas fa-star-and-crescent"></i> Checking Shabbat Status...
                    </div>
                    <div class="text-light" id="unverified-count">
                        <i class="fas fa-exclamation-circle"></i> Unverified: <span id="unverified-value">0</span>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container-fluid mt-4">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-md-3">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-filter me-2"></i>Filters</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Verification Status</label>
                                <select class="form-select" id="verification-filter">
                                    <option value="">All Sales</option>
                                    <option value="true">Verified</option>
                                    <option value="false">Unverified</option>
                                </select>
                            </div>
                            <button class="btn btn-primary w-100 mb-2" id="refresh-btn">
                                <i class="fas fa-sync-alt me-1"></i>Refresh
                            </button>
                            <button class="btn btn-success w-100" id="add-congregant-btn">
                                <i class="fas fa-user-plus me-1"></i>Add Congregant
                            </button>
                        </div>
                    </div>
                    
                    <div class="card mt-3">
                        <div class="card-header">
                            <h5><i class="fas fa-info-circle me-2"></i>System Status</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-2">
                                <strong>Total Recordings:</strong> <span id="total-recordings">0</span>
                            </div>
                            <div class="mb-2">
                                <strong>Total Sales:</strong> <span id="total-sales">0</span>
                            </div>
                            <div class="mb-2">
                                <strong>Next Shabbat:</strong> <span id="next-shabbat">-</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Main Content Area -->
                <div class="col-md-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3><i class="fas fa-receipt me-2"></i>Aliyah Sales</h3>
                        <div>
                            <input type="text" class="form-control d-inline-block w-auto me-2" id="search-input" placeholder="Search...">
                            <button class="btn btn-outline-secondary" id="search-btn">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-striped" id="sales-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Buyer</th>
                                    <th>Aliyah Type</th>
                                    <th>Amount (NIS)</th>
                                    <th>Confidence</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="sales-tbody">
                                <!-- Sales will be populated here -->
                            </tbody>
                        </table>
                    </div>
                    
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center" id="pagination">
                            <!-- Pagination will be populated here -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
        
        <!-- Verification Modal -->
        <div class="modal fade" id="verificationModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Verify Aliyah Sale</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Buyer Name</label>
                            <input type="text" class="form-control" id="modal-buyer-name" readonly>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Aliyah Type</label>
                            <input type="text" class="form-control" id="modal-aliyah-type" readonly>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Amount (NIS)</label>
                            <input type="text" class="form-control" id="modal-amount" readonly>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Transcript</label>
                            <textarea class="form-control" id="modal-transcript" rows="4" readonly></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Audio</label>
                            <audio id="modal-audio" controls class="w-100">
                                Your browser does not support the audio element.
                            </audio>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Verification Notes</label>
                            <textarea class="form-control" id="modal-notes" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="modal-verify-switch">
                                <label class="form-check-label" for="modal-verify-switch">Mark as Verified</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="save-verification-btn">Save Verification</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Our JS -->
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
